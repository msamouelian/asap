# ── General settings (auth, MCP, job orchestration) ──────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: asapbackend-config
  labels:
    app: asapbackend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  KEYCLOAK_URL:          {{ .Values.env.keycloakUrl | quote }}
  KEYCLOAK_PUBLIC_URL:   {{ .Values.env.keycloakPublicUrl | quote }}
  KEYCLOAK_REALM:        {{ .Values.env.keycloakRealm | quote }}
  KEYCLOAK_CLIENT_ID:    {{ .Values.env.keycloakClientId | quote }}
  OIDC_ROLE_CLAIM:       {{ .Values.env.oidcRoleClaim | quote }}
  NEO4J_MCP_URL:         {{ .Values.env.neo4jMcpUrl | quote }}
  {{- /* default guards --reuse-values upgrades from releases that predate this key */}}
  CYPHER_RUN_MAX_ROWS:   {{ .Values.env.cypherRunMaxRows | default "50000" | quote }}
  K8S_NAMESPACE:         {{ .Values.env.k8sNamespace | quote }}
  EXTRACTOR_JOB_NAME:    {{ .Values.env.extractorJobName | quote }}
---
# ── Chat + RAG LLM ───────────────────────────────────────────────────────────
# Coordinates and sampling knobs for the OpenAI-compatible model that drives
# the conversational agent and the RAG-internal calls. The API key lives in
# asapbackend-secret (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: asapbackend-inference-config
  labels:
    app: asapbackend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  INFERENCE_BASE_URL:              {{ .Values.env.inferenceBaseUrl | quote }}
  INFERENCE_MODEL:                 {{ .Values.env.inferenceModel | quote }}
  INFERENCE_CONTEXT_WINDOW_TOKENS: {{ .Values.env.inferenceContextWindowTokens | quote }}
  # Sampling knobs. min_p is a llama.cpp/vLLM extension the OpenAI API
  # rejects — set 0 when pointing at api.openai.com. Temperature -1 omits
  # the parameter entirely (OpenAI reasoning-class models reject it).
  INFERENCE_MIN_P:                 {{ .Values.env.inferenceMinP | quote }}
  INFERENCE_TEMPERATURE:           {{ .Values.env.inferenceTemperature | quote }}
  INFERENCE_REASONING_EFFORT:      {{ .Values.env.inferenceReasoningEffort | quote }}
---
# ── Embedding model ──────────────────────────────────────────────────────────
# The in-cluster vLLM embedding endpoint and model name. Must match what the
# extractor embedded the corpus with; install-charts.sh sets every consumer
# from the same --embedding-* parameters.
apiVersion: v1
kind: ConfigMap
metadata:
  name: asapbackend-embedding-config
  labels:
    app: asapbackend
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  EMBEDDING_BASE_URL: {{ .Values.env.embeddingBaseUrl | default "http://vllm-embedding:8000/v1" | quote }}
  EMBEDDING_MODEL:    {{ .Values.env.embeddingModel | default "BAAI/bge-small-en-v1.5" | quote }}
