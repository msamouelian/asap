image:
  repository: msamoueli/asapbackend
  tag: "latest"
  pullPolicy: Always

# ── Environment ───────────────────────────────────────────────────────────────
env:
  # Keycloak — internal service URL for JWKS fetching (pod-to-pod).
  keycloakUrl: http://keycloak
  # Browser-accessible Keycloak URL returned to the SPA via /auth/config.
  # Override with --set when deploying to a non-local environment.
  keycloakPublicUrl: https://keycloak.localhost
  keycloakRealm: asap
  keycloakClientId: asapui
  oidcRoleClaim: asap_roles
  # Neo4j MCP server endpoint (internal cluster DNS).
  neo4jMcpUrl: http://graphdb-mcp:8080
  # ── Chat + RAG LLM (OpenAI-compatible) ────────────────────────────────────
  # One model drives the conversational agent AND the RAG-internal calls
  # (query distillation, relevance filtering). No defaults on purpose —
  # provide via install-charts.sh --inference-base-url / --inference-model.
  inferenceBaseUrl: ""
  inferenceModel: ""
  # Maximum tokens the model + hardware can hold in its context window.
  # Used to compute context-usage percentage shown in the UI.
  # Example: gpt-oss-20b on M4 Pro 48GB = 131072; GPT-5.6 = 400000
  inferenceContextWindowTokens: "131072"
  # Sampling. min_p is a llama.cpp/LM Studio/vLLM extension — the real
  # OpenAI API 400s on it, so set 0 when inferenceBaseUrl is api.openai.com.
  # Temperature -1 omits the parameter from every request (required for
  # OpenAI reasoning-class models, which reject non-default temperature);
  # this also disables the UI temperature stops for that deployment.
  inferenceMinP: "0.05"
  inferenceTemperature: "0.2"
  # Reasoning effort: "" omits the parameter (LM Studio / gpt-oss).
  # Set "none" for OpenAI gpt-5-class models — required to use function
  # tools on /v1/chat/completions.
  inferenceReasoningEffort: ""
  # ── Embedding model (in-cluster vLLM) ─────────────────────────────────────
  # Embeds user questions for RAG and the kg-search vector fallback, and is
  # named in the hybrid-search Cypher so Neo4j's GenAI plugin embeds queries
  # with the SAME model the extractor used for the corpus. Must match the
  # vllm chart's model.name — install-charts.sh --embedding-model sets both.
  embeddingBaseUrl: "http://vllm-embedding:8000/v1"
  embeddingModel: "BAAI/bge-small-en-v1.5"
  # Safety ceiling for the chat UI's "run full query" button (rows returned
  # by direct read-cypher execution; the UI shows a truncation banner).
  cypherRunMaxRows: "50000"
  # Kubernetes job management
  k8sNamespace: asap
  extractorJobName: asapextractor

# ── Secrets ───────────────────────────────────────────────────────────────────
# Chat + RAG LLM API key — provide at install time via --set
# (install-charts.sh --inference-api-key). LM Studio accepts any non-empty
# token; commercial providers require a real key.
secrets:
  inferenceApiKey: ""
  # Embedding endpoint API key (install-charts.sh --embedding-api-key). Leave
  # empty for the in-cluster vLLM; required when embeddings are hosted.
  embeddingApiKey: ""
  # Secret names created by the neo4j and postgres helm charts.
  neo4jSecretName: neo4j-auth
  postgresSecretName: postgres-auth

# Shared document-upload staging volume (PVC owned by the asapdocworker chart).
docUploads:
  pvcName: doc-uploads

service:
  port: 8001

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "traefik"
  host: asapbackend.localhost
  annotations: {}

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"
