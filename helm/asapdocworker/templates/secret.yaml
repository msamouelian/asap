apiVersion: v1
kind: Secret
metadata:
  name: asapdocworker-secret
  labels:
    app: asapdocworker
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  # Embedding endpoint API key (install-charts.sh --embedding-api-key).
  embedding-api-key: {{ .Values.secrets.embeddingApiKey | default "" | quote }}
