apiVersion: batch/v1
kind: Job
metadata:
  name: asapextractor
  labels:
    app: asapextractor
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  # Deployed suspended — asapbackend unsuspends (first run) or deletes+recreates
  # (subsequent runs) this Job via the Kubernetes API.
  suspend: true
  # Keep finished Jobs for 30 days — the admin UI's "Recent Runs" history is
  # read live from the Kubernetes API, so this TTL IS the history retention.
  # (Copied onto every triggered run by asapbackend's job trigger.)
  ttlSecondsAfterFinished: 2592000
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: asapextractor
    spec:
      restartPolicy: Never
      containers:
        - name: asapextractor
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Non-secret settings from the ConfigMap.
          envFrom:
            - configMapRef:
                name: asapextractor-config
          # Neo4j connection details from the neo4j chart's Secret.
          env:
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.secretName }}
                  key: neo4j-uri
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.secretName }}
                  key: neo4j-user
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.secretName }}
                  key: neo4j-password
          volumeMounts:
            - name: asnake-config
              mountPath: /etc/asnake
              readOnly: true
      volumes:
        - name: asnake-config
          secret:
            secretName: archivesspace-secret
