image:
  repository: msamoueli/asapextractor
  tag: "latest"
  pullPolicy: Always

aspace:
  # Base URL of the ArchivesSpace REST API — not sensitive, safe to commit.
  baseurl: 'https://arstaff.lib.harvard.edu/api'
  # Provide username and password at install time via --set.
  # Do not add values here — they must not be committed to source control.
  username: ''
  password: ''

neo4j:
  # Name of the Secret created by the neo4j helm chart.
  # Must contain keys: neo4j-uri, neo4j-user, neo4j-password.
  secretName: neo4j-auth

# Wipe the entire Neo4j graph before each extraction run. The graph is
# rebuilt from scratch (~1.5 h), during which the ASAP app has no data —
# schedule runs in off hours. Set false only for development partial runs.
wipeGraph: true

# ── Embedding model (in-cluster vLLM) ────────────────────────────────────────
# The extractor's final phase embeds note chunks, titles, and agent names
# with this model; every query-time consumer (hybrid search via Neo4j's
# GenAI plugin, RAG, kg-search) must use the SAME model or vectors are not
# comparable. install-charts.sh sets every chart from one --embedding-* pair.
embedding:
  baseUrl: "http://vllm-embedding:8000/v1"
  model: "BAAI/bge-small-en-v1.5"
  # Vector size the model produces; every vector index is created with it.
  # Changing the model means changing this and re-running extraction.
  dimensions: 384
  batchSize: 64

secrets:
  # Embedding endpoint API key (install-charts.sh --embedding-api-key). Leave
  # empty for the in-cluster vLLM; required when embeddings are hosted.
  embeddingApiKey: ""
