---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-postgres
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      labels:
        app: keycloak-postgres
      annotations:
        # Restart the pod when the Secret changes so the postStart password
        # sync re-runs with the new value (env-from-secret alone does not
        # trigger a rollout).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          # Sync the role password to the Secret on EVERY start. The postgres image
          # applies POSTGRES_PASSWORD only when initialising an EMPTY data
          # directory; with a persisted volume a changed Secret otherwise diverges
          # from the role's real password (2026-09-20). Runs over the local Unix
          # socket (trust auth) with the container's own env, so it can only set
          # the password the rest of the stack has already been given. FAIL-OPEN:
          # bounded wait, always exit 0 — a failing lifecycle hook would kill the
          # database container. Progress is echoed to the container log.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    log() { echo "[password-sync] $*" > /proc/1/fd/1 2>/dev/null || true; }
                    i=0
                    while [ "$i" -lt 60 ]; do
                      if pg_isready -q -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" 2>/dev/null; then
                        # The RAISE LOG lands in Postgres's own server log (container stdout),
                        # which a hook running as a different user cannot otherwise reach.
                        if printf '%s\n' "ALTER USER :\"u\" WITH PASSWORD :'pw';" \
                             "DO \$\$ BEGIN RAISE LOG '[password-sync] role password synced to Secret'; END \$\$;" \
                             | psql -q -v ON_ERROR_STOP=1 -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                                    -v u="$POSTGRES_USER" -v pw="$POSTGRES_PASSWORD" >/dev/null 2>&1; then
                          log "role '$POSTGRES_USER' password synced to Secret"
                        else
                          log "WARNING: could not sync role password (non-fatal)"
                        fi
                        exit 0
                      fi
                      i=$((i+1)); sleep 2
                    done
                    log "WARNING: server not ready after 120s; password not synced (non-fatal)"
                    exit 0
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: keycloak-postgres
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  type: ClusterIP
  selector:
    app: keycloak-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
