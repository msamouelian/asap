apiVersion: batch/v1
kind: Job
metadata:
  name: kggenerator
  labels:
    app: kggenerator
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  # Deployed suspended — asapbackend clones this Job via the Kubernetes API
  # when an admin triggers "Generate Knowledge Graph" (same pattern as
  # asapextractor). The kggenerator reads the extracted graph from Neo4j and
  # writes ONLY :Inferred nodes; it never touches ArchivesSpace.
  suspend: true
  # Keep finished Jobs for 30 days — the admin UI's "Recent Runs" history is
  # read live from the Kubernetes API, so this TTL IS the history retention.
  ttlSecondsAfterFinished: 2592000
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: kggenerator
    spec:
      restartPolicy: Never
      containers:
        - name: kggenerator
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["all"]
          # One ConfigMap per concern: job settings, the KG LLM, the embedding model.
          envFrom:
            - configMapRef:
                name: kggenerator-config
            - configMapRef:
                name: kggenerator-inference-config
            - configMapRef:
                name: kggenerator-embedding-config
          env:
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.secretName }}
                  key: neo4j-uri
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.secretName }}
                  key: neo4j-user
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4j.secretName }}
                  key: neo4j-password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: postgres-url
            # Knowledge-graph LLM API key from this chart's own Secret.
            - name: KG_INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kggenerator-secret
                  key: inference-api-key
            # Embedding endpoint API key (empty for in-cluster vLLM).
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kggenerator-secret
                  key: embedding-api-key
