apiVersion: v1
kind: Secret
metadata:
  name: kggenerator-secret
  labels:
    app: kggenerator
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  # Knowledge-graph LLM API key (install-charts.sh --kg-inference-api-key).
  # Independent of the chat+RAG key in asapbackend-secret so the two models
  # can be different providers.
  inference-api-key: {{ .Values.secrets.inferenceApiKey | quote }}
  embedding-api-key: {{ .Values.secrets.embeddingApiKey | default "" | quote }}
