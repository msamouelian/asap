image:
  repository: msamoueli/kggenerator
  tag: "latest"
  pullPolicy: Always

# ── Knowledge-graph LLM (OpenAI-compatible) ──────────────────────────────────
# ONE model serves both kg-generation phases that call an LLM: entity/
# relationship extraction and entity-resolution adjudication. Configured
# independently of the chat+RAG model in the asapbackend chart. No defaults
# on purpose — provide via install-charts.sh --kg-inference-base-url /
# --kg-inference-model (and --kg-inference-api-key, stored in secret.yaml).
inference:
  baseUrl: ""
  model: ""
  # Sampling temperature. "-1" OMITS the parameter — required for OpenAI
  # gpt-5-class models, which reject any non-default value (2026-09-20: every
  # adjudication 400'd with temperature 0). LM Studio / vLLM accept "0".
  temperature: "0"
  # Reasoning effort: "" omits the parameter (LM Studio / gpt-oss). When set
  # (e.g. "low" for OpenAI), the generator also switches max_tokens →
  # max_completion_tokens, which gpt-5-class models require.
  reasoningEffort: ""

secrets:
  # Knowledge-graph LLM API key — provide at install time via --set
  # (install-charts.sh --kg-inference-api-key). LM Studio accepts any
  # non-empty token; commercial providers require a real key.
  inferenceApiKey: ""
  # Embedding endpoint API key (install-charts.sh --embedding-api-key). Leave
  # empty for the in-cluster vLLM; required when embeddings are hosted.
  embeddingApiKey: ""

# ── Embedding model (in-cluster vLLM) ────────────────────────────────────────
# Inferred-entity embeddings must use the SAME model the extractor used for
# the corpus so vectors are comparable in hybrid search. install-charts.sh
# sets every consumer from the same --embedding-* parameters.
embedding:
  baseUrl: "http://vllm-embedding:8000/v1"
  model: "BAAI/bge-small-en-v1.5"
  # Vector size the model produces — must match the extractor's indexes.
  dimensions: 384
  batchSize: 64

neo4j:
  # Secret created by the neo4j chart: neo4j-uri, neo4j-user, neo4j-password.
  secretName: neo4j-auth

postgres:
  # Secret created by the postgres chart: postgres-url is a full DSN.
  secretName: postgres-auth

# Re-extract every collection instead of skipping ones that already have
# artifacts. Extraction is the expensive LLM phase (~hours at scale) —
# leave false unless the extraction prompt or surface builder changed.
force: false
