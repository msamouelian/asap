apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphdb-mcp
  labels:
    app: graphdb-mcp
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphdb-mcp
  template:
    metadata:
      labels:
        app: graphdb-mcp
    spec:
      containers:
        - name: graphdb-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            # HTTP transport (v2 contract): no URI, database or credentials
            # are configured server-side. Every request from asapbackend
            # carries Basic Auth, an X-Neo4j-MCP-URI header and the database
            # in the path (/db/{database}/mcp). allowedUris gates the header.
            - name: NEO4J_MCP_TRANSPORT_MODE
              value: "http"
            - name: NEO4J_MCP_HTTP_ALLOWED_URIS
              value: {{ .Values.neo4j.allowedUris | quote }}

            # Read-only mode — prevents the LLM from issuing write queries.
            - name: NEO4J_MCP_READ_ONLY
              value: {{ .Values.neo4j.readOnly | quote }}

            # Only register the tools asapbackend dispatches.
            - name: NEO4J_MCP_TOOLS
              value: {{ .Values.neo4j.tools | quote }}

            - name: NEO4J_MCP_REQUEST_TIMEOUT
              value: {{ .Values.neo4j.requestTimeout | quote }}

            # Override the default 127.0.0.1 so the pod is reachable from
            # other pods inside the cluster.
            - name: NEO4J_MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: NEO4J_MCP_HTTP_PORT
              value: {{ .Values.server.port | quote }}

            # Allow the readiness/liveness probes to hit /healthz without auth.
            - name: NEO4J_MCP_HTTP_ALLOW_UNAUTHENTICATED_PING
              value: "true"
            - name: NEO4J_MCP_TELEMETRY
              value: "false"

          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.server.port }}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
