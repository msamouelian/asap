{{- if .Values.ingress.enabled }}
---
# Redirect plain HTTP to HTTPS (neo4j-scoped so this chart is self-contained
# and does not depend on another chart's middleware).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: neo4j-redirect-to-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP ingress — redirects to HTTPS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neo4j-http
  labels:
    app: neo4j
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-neo4j-redirect-to-https@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphdb
                port:
                  name: http
---
# HTTPS ingress — serves the Neo4j Browser UI over TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neo4j
  labels:
    app: neo4j
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphdb
                port:
                  name: http
{{- end }}
