{{- if .Values.ingress.enabled }}
# Routes Bolt-over-WebSocket (wss) to the database while plain HTTPS serves
# the Browser UI — both on the same host over TLS, so users need no
# port-forward. Neo4j Browser (loaded over HTTPS) tunnels Bolt inside a
# secure WebSocket, which is ordinary HTTPS at the ingress; this rule matches
# the Upgrade header and outranks (priority) the standard Ingress for the host.
# HeadersRegexp is the Traefik v2 matcher (k3s ships 2.x); switch to Header()
# if Traefik is ever upgraded to v3 and this rule stops matching.
# Note: only browser (WebSocket) clients ride this path — desktop drivers and
# cypher-shell speak raw TCP Bolt and still need a port-forward.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: neo4j-bolt-websocket
  labels:
    app: neo4j
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingress.host }}`) && HeadersRegexp(`Upgrade`, `(?i)^websocket$`)
      priority: 100
      services:
        - name: graphdb
          port: 7687
  tls:
    secretName: {{ .Values.ingress.tlsSecret }}
{{- end }}
