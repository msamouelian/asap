apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-entrypoint
  labels:
    app: ollama
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e

    # Start the Ollama server in the background.
    ollama serve &
    OLLAMA_PID=$!

    # Wait until the server accepts API requests.
    # Uses 'ollama list' rather than curl — curl is not in the ollama image.
    echo "Waiting for Ollama server to start..."
    until ollama list > /dev/null 2>&1; do
      sleep 2
    done
    echo "Ollama server is ready."

    # Pull the model. If it is already cached in the persistent volume
    # this completes immediately; otherwise it downloads the full weights.
    echo "Pulling model {{ .Values.model.name }} (cached pulls are instant)..."
    ollama pull {{ .Values.model.name }}
    echo "Model {{ .Values.model.name }} is ready."

    # Write a sentinel file so the readiness probe knows the model is
    # available and the pod can start receiving traffic.
    touch /tmp/model-ready

    # Keep the container alive by waiting on the server process.
    wait $OLLAMA_PID
