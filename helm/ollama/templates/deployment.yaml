apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/entrypoint.sh"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # Store models in the persistent volume so they survive pod restarts.
            - name: OLLAMA_MODELS
              value: /ollama-data/models

          volumeMounts:
            - name: data
              mountPath: /ollama-data
            - name: entrypoint
              mountPath: /scripts

          # startupProbe gives the container time to download the model on
          # first boot before liveness/readiness probes begin. 60 attempts
          # × 10 s = 10 minutes maximum, enough for llama3.1:8b on most
          # home connections.
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/model-ready"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/tags
              port: {{ .Values.service.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/tags
              port: {{ .Values.service.port }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-pvc
        - name: entrypoint
          configMap:
            name: ollama-entrypoint
            defaultMode: 0755
