apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  labels:
    app: postgres
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  postgres-user: {{ .Values.auth.user | quote }}
  postgres-password: {{ .Values.auth.password | quote }}
  {{- /* Credentials are percent-encoded: a password containing '@', ':', '/',
       '#' or '?' would otherwise corrupt the URI (an '@' in the password made
       psycopg resolve host 'sca@postgres', 2026-09-20). Consumers (asapbackend,
       kggenerator, asapdocworker) read this URL verbatim. */}}
  postgres-url: {{ printf "postgresql://%s:%s@postgres:5432/%s" (.Values.auth.user | urlquery) (.Values.auth.password | urlquery) .Values.auth.database | quote }}
