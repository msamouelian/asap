apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ .Values.model.name | quote }}
            - "--dtype"
            - "float32"
            - "--port"
            - {{ .Values.server.internalPort | quote }}
            - "--max-model-len"
            - {{ .Values.model.maxModelLen | quote }}
            - "--gpu-memory-utilization"
            - {{ .Values.server.cpuMemoryUtilization | quote }}
          ports:
            - name: http-internal
              containerPort: {{ .Values.server.internalPort }}
          env:
            # Cache the HuggingFace model download in the persistent volume so
            # it survives pod restarts without re-downloading.
            - name: HF_HOME
              value: /vllm-data/huggingface
            # Control CPU thread parallelism. OMP covers PyTorch/ONNX;
            # OPENBLAS and MKL cover BLAS-backed operations. All three are set
            # to the same value to prevent oversubscription.
            - name: OMP_NUM_THREADS
              value: {{ .Values.server.numCpuThreads | quote }}
            - name: OPENBLAS_NUM_THREADS
              value: {{ .Values.server.numCpuThreads | quote }}
            - name: MKL_NUM_THREADS
              value: {{ .Values.server.numCpuThreads | quote }}
            {{- if .Values.model.hfToken }}
            - name: HF_TOKEN
              value: {{ .Values.model.hfToken | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /vllm-data

          # The startupProbe gives the container time to download the model on
          # first boot before liveness/readiness probes begin.
          # bge-small-en-v1.5 is ~130 MB; 60 attempts × 10s = 10 minutes headroom.
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.internalPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.internalPort }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.internalPort }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}

        # nginx sidecar: listens on the service port and forwards to vLLM after
        # stripping the Upgrade: h2c headers that Java's HttpClient injects.
        # Without this, uvicorn drops the request body when it sees h2c headers,
        # causing Pydantic to report a missing body (400 Bad Request).
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vllm-pvc
        - name: nginx-config
          configMap:
            name: vllm-nginx-config
