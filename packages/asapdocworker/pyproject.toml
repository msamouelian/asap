[project]
name = "asapdocworker"
version = "0.1.0"
description = "ASAP document ingestion worker: docling conversion, chunking, embedding, Neo4j load"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.15",
    "neo4j>=5.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asapdocworker"]
