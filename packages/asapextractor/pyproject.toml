[project]
name = "asapextractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ArchivesSnake>=0.9",
    "neo4j>=5.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asapextractor"]
