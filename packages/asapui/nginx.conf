server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to asapbackend, stripping the /api prefix.
    # proxy_buffering off is required for SSE streaming (chat responses).
    location /api/ {
        proxy_pass http://asapbackend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        # Document-collection uploads: nginx's default body cap is 1 MB,
        # which 413s any real document folder. Stream the request straight
        # through to the backend instead of buffering it to nginx disk first.
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
    }

    # SPA fallback — all non-file routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
