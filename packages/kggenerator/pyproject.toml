[project]
name = "kggenerator"
version = "0.1.0"
description = "ASAP knowledge graph generator: LLM entity/relation extraction from the archival text surface, entity resolution, Neo4j load"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kggenerator"]
